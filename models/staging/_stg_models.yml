version: 2

models:
  - name: stg_patients
    description: Patient records with standardized names, age, gender, and state.
    columns:
      - name: patient_id
        data_tests:
          - unique
          - not_null
      - name: gender
        data_tests:
          - accepted_values:
              arguments:
                values: ['F', 'M']

  - name: stg_encounters
    description: Standardized encounter records and charges.
    columns:
      - name: encounter_id
        data_tests:
          - unique
          - not_null
      - name: patient_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_patients')
                field: patient_id