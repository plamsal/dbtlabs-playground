version: 2

models:
  - name: fct_patient_summary
    description: One row per patient with encounter counts, total charges, and most recent visit.
    columns:
      - name: patient_id
        data_tests:
          - unique
          - not_null
      - name: total_encounters
        data_tests:
          - not_null
      - name: total_charges
        data_tests:
          - not_null